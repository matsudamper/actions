name: Test upload-qr-code

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Upload with artifact name
        id: qr_named
        uses: ./upload-qr-code
        with:
          url: 'https://example.com/named'
          output_path: qr-named.png
          artifact_name: test-qr-named

      - name: Upload without artifact name
        id: qr_default
        uses: ./upload-qr-code
        with:
          url: 'https://example.com/default'
          output_path: qr-default.png

      - name: Upload URL starting with hyphen
        id: qr_hyphen
        uses: ./upload-qr-code
        with:
          url: '-https://example.com/hyphen'
          output_path: qr-hyphen.png

      - name: Verify PNG files and outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f qr-named.png
          test -f test-qr-named.png
          test -f qr-default.png
          test -f qr-hyphen.png
          file qr-named.png | grep -qi 'PNG image'
          file test-qr-named.png | grep -qi 'PNG image'
          file qr-default.png | grep -qi 'PNG image'
          file qr-hyphen.png | grep -qi 'PNG image'
          [[ "${{ steps.qr_named.outputs.path }}" == "qr-named.png" ]]
          [[ -n "${{ steps.qr_named.outputs.artifact-url }}" ]]
          [[ "${{ steps.qr_default.outputs.path }}" == "qr-default.png" ]]
          [[ -n "${{ steps.qr_default.outputs.artifact-url }}" ]]
          [[ "${{ steps.qr_hyphen.outputs.path }}" == "qr-hyphen.png" ]]
          [[ -n "${{ steps.qr_hyphen.outputs.artifact-url }}" ]]

          python3 - <<'PY'
          import struct

          expected_width = 330

          def png_width(path: str) -> int:
              with open(path, "rb") as f:
                  f.read(16)
                  width, _height = struct.unpack(">II", f.read(8))
                  return width

          for path in (
              "qr-named.png",
              "test-qr-named.png",
              "qr-default.png",
              "qr-hyphen.png",
          ):
              width = png_width(path)
              if width != expected_width:
                  raise SystemExit(f"{path}: width {width} != expected {expected_width}")
              print(f"{path}: width={width}")
          PY
