name: Test gradle-remote-cache-credentials

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    # fork の PR では OIDC トークンを受け取れない
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./gradle-remote-cache-credentials

      - name: Verify exported credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$S3_BUILD_CACHE_ACCESS_KEY_ID" && "$S3_BUILD_CACHE_ACCESS_KEY_ID" != "null" ]]
          [[ -n "$S3_BUILD_CACHE_SECRET_KEY" && "$S3_BUILD_CACHE_SECRET_KEY" != "null" ]]
          [[ -n "$S3_BUILD_CACHE_SESSION_TOKEN" && "$S3_BUILD_CACHE_SESSION_TOKEN" != "null" ]]
